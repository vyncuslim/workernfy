name: Test Worker and dry run
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Test security and ntfy protocols
        run: npm test
      - name: Validate Cloudflare Worker bundle
        run: npm run check
